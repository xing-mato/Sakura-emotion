api: 4
id: sakuratools.emotion_pool
name: 情绪池
author: mato
description: 让 Sakura 有会自己变化的情绪：从二十六种情绪里挑出「主·次·辅」三根表现出来，另外三根留作不表现的余韵；每轮她说完话由模型决定谁在场、增减多少；左侧栏有独立的「情绪」页（胶囊条仪表盘）。
version: 1.0.0-beta.8
entry: plugin:EmotionPoolPlugin
enabled: true
provides: []
requires:
  - sakura.host.logging
  - sakura.host.context
  - sakura.host.timeline
  - sakura.host.character
  - sakura.host.settings
  - sakura.host.settings.collection-v0
  - sakura.host.tools
  - sakura.host.model_slots.v2
  - sakura.host.artifacts
presentation:
  kind: extension
  category: tools
  icon: sparkles
